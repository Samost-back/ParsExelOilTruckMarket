services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      PGTZ: ${TZ:-Europe/Kyiv}
      POSTGRES_USER:     ${PG_USER:?PG_USER required in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD required in .env}
      POSTGRES_DB:       ${PG_DB:?PG_DB required in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    # Якщо потрібен прямий доступ з host (dev/admin), розкоментуйте ports.
    # На prod НЕ публікуйте postgres — він і так доступний для app через docker network.
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Довіра reverse-proxy (HTTPS-only за nginx/Caddy/Traefik). На prod
      # дефолт true (бо NODE_ENV=production), але лишаємо явним для прозорості.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Часовий пояс — Київ. Впливає на логи й Node Date; UI додатково
      # форматує дати у Europe/Kyiv через view-helpers (UI_TZ).
      TZ: ${TZ:-Europe/Kyiv}
      UI_TZ: ${UI_TZ:-Europe/Kyiv}
      PORT: 3000
      HOST: 0.0.0.0
      # БД
      PG_HOST: db
      PG_PORT: 5432
      PG_DB:       ${PG_DB:?PG_DB required}
      PG_USER:     ${PG_USER:?PG_USER required}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD required}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      # Сесії
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required (>=32 chars)}
      # TruckMarket
      TRUCK_BASE_URL: ${TRUCK_BASE_URL:?required}
      KEY_ID:         ${KEY_ID:?required}
      SECRET_KEY:     ${SECRET_KEY:?required}
      USER_ID:        ${USER_ID:?required}
      COMPANY_ID:     ${COMPANY_ID:?required}
      GEO_CITY_ID_DEFAULT: ${GEO_CITY_ID_DEFAULT:?required}
      # OpenAI (опціонально)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL:   ${OPENAI_MODEL:-gpt-4o-mini}
      # Сховище файлів: local (volume) | s3 (бакет). Дефолт local.
      STORAGE_DRIVER:       ${STORAGE_DRIVER:-local}
      STORAGE_ROOT:         ${STORAGE_ROOT:-}
      S3_BUCKET:            ${S3_BUCKET:-}
      S3_REGION:            ${S3_REGION:-}
      # Креди для S3. Адаптер читає S3_*; якщо порожні — AWS SDK бере стандартний
      # ланцюг (AWS_* нижче). У .env ключі задані як AWS_*, тож прокидаємо їх.
      S3_ACCESS_KEY_ID:     ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION:            ${S3_REGION:-}
      S3_ENDPOINT:          ${S3_ENDPOINT:-}
      S3_KEY_PREFIX:        ${S3_KEY_PREFIX:-}
      S3_SIGNED_URL_TTL:    ${S3_SIGNED_URL_TTL:-3600}
      # Ліміти/обмеження
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}   # 500 MB
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
    volumes:
      - photos_storage:/app/photos_storage
      - uploads:/app/uploads
    # Порт 3000 НЕ публікуємо назовні — доступ лише через Caddy (HTTPS-only)
    # у приватній docker-мережі. Для локального dev-доступу до HTTP розкоментуйте:
    # ports:
    #   - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      # Через Node (а не wget/curl — їх немає в slim-образі). Перевіряє /health.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reverse-proxy з автоматичним HTTPS (Let's Encrypt). Єдина точка входу
  # ззовні. TLS на домен APP_DOMAIN (для EC2 — публічний DNS-хост).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required (напр. ec2-34-205-88-192.compute-1.amazonaws.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # сертифікати (важливо зберігати між рестартами)
      - caddy_config:/config

volumes:
  pg_data:
  photos_storage:
  uploads:
  caddy_data:
  caddy_config:
