services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-truck_oil_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # БД
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: ${PG_DB:-truck_oil_db}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      # Сесії
      SESSION_SECRET: ${SESSION_SECRET}
      # TruckMarket
      TRUCK_BASE_URL: ${TRUCK_BASE_URL}
      KEY_ID: ${KEY_ID}
      SECRET_KEY: ${SECRET_KEY}
      USER_ID: ${USER_ID}
      COMPANY_ID: ${COMPANY_ID}
      GEO_CITY_ID_DEFAULT: ${GEO_CITY_ID_DEFAULT}
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - photos_storage:/app/photos_storage
      - uploads:/app/uploads
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pg_data:
  photos_storage:
  uploads:
